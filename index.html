<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#242754">
  <meta name="description" content="水曜日限定、週に一度の夜活ガチャ。100ptが当たるかも？">
  <title>水曜日限定 夜活ガチャ</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">
  <!-- Google tag (gtag.js): 夜活ガチャ GitHub Pages 専用 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YEXY7TE0FT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YEXY7TE0FT');
  </script>
  <link rel="preload" as="image" href="assets/images/yokatsu-gacha-logo.png">
  <link rel="preload" as="image" href="assets/images/background.png">
  <link rel="stylesheet" href="styles.css?v=20261007-7">
  <script src="app.js?v=20261007-5" defer></script>
</head>
<body>
  <main class="page" data-app>
    <div class="night-sky" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><b></b><b></b></div>
    <div class="page__inner">
      <section class="event" aria-labelledby="event-title">
        <h1 class="event__logo" id="event-title">
          <img src="assets/images/yokatsu-gacha-logo.png" alt="水曜日限定 夜活ガチャ" width="1672" height="941">
        </h1>
        <div class="stage">
          <div class="stage__floor" aria-hidden="true"></div>
          <div class="machine" data-machine>
            <img src="assets/images/gacha-machine.png" alt="カラフルなカプセルが入ったガチャポン">
            <div class="capsule-motion" aria-hidden="true"><i></i><i></i><i></i></div>
          </div>
        </div>

        <section class="card" aria-live="polite" aria-atomic="true">
          <div class="confetti" data-confetti aria-hidden="true"></div>
          <div class="view" data-view="loading">
            <span class="spinner" aria-hidden="true"></span>
            <p>今週の参加状況を確認しています…</p>
          </div>

          <div class="view" data-view="ready" hidden>
            <button class="button button--gacha" type="button" data-action="draw">
              <span>ガチャを回す</span>
            </button>
          </div>

          <div class="view" data-view="drawing" hidden>
            <button class="button button--gacha button--busy" type="button" disabled>
              <span class="spinner spinner--small" aria-hidden="true"></span><span>抽選中…</span>
            </button>
            <p class="card__note">そのまま少しお待ちください</p>
          </div>

          <div class="view" data-view="win" hidden>
            <p class="result__eyebrow" data-participated hidden>今週は参加済みです</p>
            <section class="result result--win">
              <img class="win-decor win-decor--star win-decor--star-upper-left" src="assets/images/decor-star.png" alt="" aria-hidden="true">
              <img class="win-decor win-decor--star win-decor--star-upper-right" src="assets/images/decor-star.png" alt="" aria-hidden="true">
              <img class="win-decor win-decor--star win-decor--star-middle-left" src="assets/images/decor-star.png" alt="" aria-hidden="true">
              <img class="win-decor win-decor--star win-decor--star-middle-right" src="assets/images/decor-star.png" alt="" aria-hidden="true">
              <img class="win-decor win-decor--star win-decor--star-lower-center" src="assets/images/decor-star.png" alt="" aria-hidden="true">
              <h2>当たり！</h2>
              <p class="result__points">100ptプレゼント✨</p>
              <div class="result__character-slot"><img class="result__character result__character--win" src="assets/images/ria-win.png" alt="喜んでいるリアちゃん"></div>
              <div class="result__reward">
                <p class="result__code-label">キャンペーンコード</p>
                <div class="result__code-row">
                  <p class="result__code" data-code></p>
                  <button class="copy-icon" type="button" data-action="copy" aria-label="キャンペーンコードをコピー" title="キャンペーンコードをコピー">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 8V5.8A2.8 2.8 0 0 1 10.8 3h7.4A2.8 2.8 0 0 1 21 5.8v7.4a2.8 2.8 0 0 1-2.8 2.8H16v2.2a2.8 2.8 0 0 1-2.8 2.8H5.8A2.8 2.8 0 0 1 3 18.2v-7.4A2.8 2.8 0 0 1 5.8 8H8Zm2 0h3.2a2.8 2.8 0 0 1 2.8 2.8V14h2.2c.44 0 .8-.36.8-.8V5.8a.8.8 0 0 0-.8-.8h-7.4a.8.8 0 0 0-.8.8V8Zm3.2 2H5.8a.8.8 0 0 0-.8.8v7.4c0 .44.36.8.8.8h7.4a.8.8 0 0 0 .8-.8v-7.4a.8.8 0 0 0-.8-.8Z"/></svg>
                  </button>
                </div>
                <p class="result__copy-feedback" data-copy-feedback aria-live="polite"></p>
                <a class="button button--claim" href="https://app-clear.com/open?act=campaign_code">ポイントを受け取る</a>
                <p class="result__help">遷移しない場合は、マイページのキャンペーンコード入力からもお受け取りが可能です</p>
              </div>
            </section>
          </div>

          <div class="view" data-view="lose" hidden>
            <p class="result__eyebrow" data-participated hidden>今週は参加済みです</p>
            <section class="result result--lose">
              <img class="lose-decor lose-decor--moon" src="assets/images/decor-moon.png" alt="" aria-hidden="true">
              <img class="lose-decor lose-decor--star lose-decor--star-upper-left" src="assets/images/decor-star.png" alt="" aria-hidden="true">
              <img class="lose-decor lose-decor--star lose-decor--star-upper-right" src="assets/images/decor-star.png" alt="" aria-hidden="true">
              <img class="lose-decor lose-decor--star lose-decor--star-middle-left" src="assets/images/decor-star.png" alt="" aria-hidden="true">
              <img class="lose-decor lose-decor--star lose-decor--star-middle-right" src="assets/images/decor-star.png" alt="" aria-hidden="true">
              <img class="lose-decor lose-decor--star lose-decor--star-lower-left" src="assets/images/decor-star.png" alt="" aria-hidden="true">
              <img class="lose-decor lose-decor--star lose-decor--star-lower-center" src="assets/images/decor-star.png" alt="" aria-hidden="true">
              <img class="lose-decor lose-decor--star lose-decor--star-lower-right" src="assets/images/decor-star.png" alt="" aria-hidden="true">
              <h2>ざんねん…</h2>
              <div class="result__character-slot">
                <div class="result__sleep-scene">
                  <img class="result__character result__character--lose" src="assets/images/ria-lose-sleep.png" alt="おやすみモードのリアちゃん">
                  <img class="lose-decor--zzz" src="assets/images/decor-zzz.png" alt="" aria-hidden="true">
                </div>
              </div>
              <p class="result__sleep-message">今日はおやすみモードかも…🌿</p>
              <p class="result__message">また来週も参加してみてね</p>
            </section>
          </div>

          <div class="view" data-view="closed" hidden>
            <section class="result">
              <h2>現在は開催時間外です</h2>
              <p>開催日時になったら、もう一度アクセスしてください</p>
            </section>
          </div>

          <div class="view" data-view="unavailable" hidden>
            <section class="result result--info">
              <h2>ただいまご利用いただけません</h2>
              <p>時間をおいて再度お試しください</p>
              <button class="button button--secondary" type="button" data-action="retry">再度確認する</button>
            </section>
          </div>

          <div class="view" data-view="error" hidden>
            <section class="result result--info">
              <h2>通信を確認してください</h2>
              <p>結果を確認できませんでした。通信状態をご確認ください。</p>
              <button class="button button--secondary" type="button" data-action="retry">参加状況を再確認する</button>
            </section>
          </div>
        </section>
      </section>
      <iframe class="gas-bridge" title="抽選サービスとの安全な通信" aria-hidden="true" tabindex="-1"></iframe>
    </div>
  </main>
</body>
</html>
